name: dama_mobile
description: dama International Draughts player app (Flutter).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  http: ^1.2.2
  http_parser: ^4.0.2
  image_picker: ^1.1.2
  web_socket_channel: ^3.0.1
  graphql_flutter: ^5.1.2
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.9.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  intl: ^0.19.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  graphql_codegen: ^1.2.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/move.mp3
    - assets/sounds/capture.mp3
    - assets/sounds/promote.mp3
    - assets/sounds/game-start.mp3
    - assets/sounds/invite-ring.wav
    - assets/sounds/message.wav
    - assets/brand/dama-mark.svg
    - assets/brand/dama-mark.png
    - assets/brand/dama-mark-burgundy.png
    - assets/brand/dama-mark-burgundy.svg
    - assets/brand/dama-mark-white.svg
    - assets/brand/dama-mark-white.png
    - assets/brand/dama-avatar-default-light.png
    - assets/brand/dama-avatar-default-dark.png
    - assets/pieces/neo/
