# Optional TLS edge overlay for production-like local runs.
# Usage: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Layer 4 (TLS 1.3) terminates at Caddy. Upstream containers stay on the
# internal Docker network. For full mTLS between services, mount client certs
# and enable Caddy transport tls with client auth in a private CA setup.

services:
  caddy:
    image: caddy:2-alpine
    container_name: dama_caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - dama_caddy_data:/data
      - dama_caddy_config:/config
    depends_on:
      - backend-api
      - nextjs-web

volumes:
  dama_caddy_data:
  dama_caddy_config:
