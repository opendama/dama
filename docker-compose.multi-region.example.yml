# Example: two API replicas sharing one Postgres + Redis (Day-2 HA sketch).
# Not a live multi-cloud anycast setup. Replace URLs with real managed endpoints.
# Do not invent region hostnames in application code.
#
# Usage (after filling .env.region-a / .env.region-b):
#   docker compose -f docker-compose.multi-region.example.yml --profile demo up -d --build
#
# Production: deploy the same apps/api/Dockerfile image twice (us / eu) behind
# Cloudflare latency DNS. Keep payment webhooks on a single primary URL.

services:
  api-a:
    profiles: ["demo"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: dama-api:${DAMA_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${DAMA_API_PORT_A:-8080}:8080"
    env_file:
      - ${DAMA_ENV_FILE_A:-.env}
    environment:
      DAMA_API_HOST: 0.0.0.0
      DAMA_API_PORT: "8080"
      # Ops label only (logs). Quotas/state stay Redis/Postgres server-side.
      DAMA_REGION_LABEL: ${DAMA_REGION_LABEL_A:-region-a}
    healthcheck:
      test: ["CMD", "/app/server", "-readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  api-b:
    profiles: ["demo"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: dama-api:${DAMA_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${DAMA_API_PORT_B:-8081}:8080"
    env_file:
      - ${DAMA_ENV_FILE_B:-.env}
    environment:
      DAMA_API_HOST: 0.0.0.0
      DAMA_API_PORT: "8080"
      DAMA_REGION_LABEL: ${DAMA_REGION_LABEL_B:-region-b}
    healthcheck:
      test: ["CMD", "/app/server", "-readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
